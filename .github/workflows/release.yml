name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a publish in flight

# Read-only by default; the two jobs that need more (publish: OIDC, github-release: contents write)
# grant it at job level.
permissions:
  contents: read

jobs:
  verify-tag:
    # A tag is a one-shot, publish-triggering action: refuse one that isn't on `main` or whose
    # version doesn't match pyproject.toml (PyPI versions are burned — a mismatch can't be undone).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need main's history for the ancestry check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag commit must be reachable from origin/main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to publish"; exit 1; }
      - name: Tag must match the pyproject.toml version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{ver}":
              sys.exit(f"::error::tag {tag} does not match pyproject version {ver} (expected v{ver})")
          print(f"tag {tag} matches version {ver}")
          PY

  test:
    # The same gates `ci-ok` enforces on a PR (lint, pyright, coverage-gated tests, inline-JS guard,
    # core-only install) — a release must not clear a weaker bar than a merge. Python 3.12 only; the
    # full 3.10–3.14 matrix already ran on the merge commit.
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install (all extras + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all,dev]' pyright
      - name: Lint
        run: ruff check .
      - name: Pyright (basic, passiveworkers/net)
        run: pyright
      - name: Compile
        run: python -m compileall passiveworkers scripts
      - name: Unit tests + coverage (whole project)
        run: pytest tests/ -q --cov=passiveworkers --cov-report=term-missing --cov-fail-under=75
      - name: Coverage floor — user-facing modules
        run: pytest tests/ -q --cov=passiveworkers.doctor --cov=passiveworkers.net.agent --cov=passiveworkers.operator --cov=passiveworkers.mcp_server --cov-report=term-missing --cov-fail-under=75
      - name: Inline-JS guard + front-end harness
        run: bash scripts/check_app_js.sh && node scripts/fe_test.js

  core-install:
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core only (no extras) and run the core-safe tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pworkers --help
          pworkers version
          pytest tests/test_cli.py tests/test_export.py tests/test_sanitize.py tests/test_citations.py -q

  build:
    needs: [test, core-install]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/passiveworkers/
    permissions:
      id-token: write   # OIDC — no stored PyPI token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A retried run after a partial success (e.g. sdist uploaded, wheel upload dropped)
          # would otherwise have PyPI reject the already-accepted file, fail this job again,
          # and never reach github-release — leaving a published version with no GitHub Release.
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with build provenance
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
