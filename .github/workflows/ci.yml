name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual re-runs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]' pytest
      - name: Compile
        run: python -m compileall council scripts
      - name: Unit tests
        run: pytest tests/ -q
      - name: Inline-JS guard (served pages)
        run: bash scripts/check_app_js.sh
      - name: Front-end harness
        run: node scripts/fe_test.js
