name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  schedule:
    - cron: "27 4 * * 1"   # weekly (Monday 04:27 UTC): picks up new queries on unchanged code
  workflow_dispatch:

# Read-only token by default; only the analyze job gets the one write scope it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Same rule as ci.yml: never cancel a main run, only superseded feature-branch pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Not a required check (only ci.yml's `ci-ok` is); results land in the Security tab.
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          build-mode: none   # interpreted language: no build step
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
