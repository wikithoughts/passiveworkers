# .orchestration/lanes.yml — PassiveWorkers
# Python project (ruff + pyright + pytest, coverage floor 75% enforced in CI). `gh-pages`
# is a separate content branch (the live wikithoughts.github.io/passiveworkers/ source),
# not something any lane will touch. release.yml triggers on version tags, not on merge —
# no merge-triggered deploy exists for this repo.
verify: "ruff check . && pytest tests/ -q --cov=passiveworkers --cov-fail-under=75"

hot_files: []
counters: {}
singleton_paths: []
deploy_on_merge: []

setup:
  run: null
  copy_env: []
  ports: {}

# Real check-run names from ci.yml (a matrix job reports one run per version, e.g. `test (3.12)`).
# `types` is continue-on-error (advisory), so it is not listed. The GitHub ruleset on the default
# branch blocks only deletion and non-fast-forward (read via `gh api` 2026-10-05): these checks are
# what the fleet waits for, not something GitHub enforces. ci.yml uses paths-ignore for `docs/**`
# and `**.md`, so a docs-only PR gets no check runs at all.
required_checks: [lint, "test (3.10)", "test (3.11)", "test (3.12)", "test (3.13)", "test (3.14)", frontend, core-install]
merge: squash
force_push: allowed
serialized_ci: []
