# .orchestration/lanes.yml — PassiveWorkers
# Python project (ruff + pyright + pytest, coverage floor 75% enforced in CI). `gh-pages`
# is a separate content branch (the live wikithoughts.github.io/passiveworkers/ source),
# not something any lane will touch. release.yml triggers on version tags, not on merge —
# no merge-triggered deploy exists for this repo.
verify: "ruff check . && pytest tests/ -q --cov=passiveworkers --cov-fail-under=75"

hot_files: []
counters: {}
singleton_paths: []
deploy_on_merge: []

setup:
  run: null
  copy_env: []
  ports: {}

# `ci-ok` is the single required check: an aggregate job in ci.yml that needs every other job
# (changes, lint, types, test matrix, frontend, core-install), always runs, and fails if any of them
# failed or was cancelled. Docs-only PRs skip the heavy jobs (the `changes` job) and ci-ok still
# passes, so nothing waits forever. GitHub enforces it via a required_status_checks rule on the
# "fleet: protect default branch" ruleset (id 23950251). `types` is continue-on-error (advisory).
required_checks: [ci-ok]
merge: squash
force_push: allowed
serialized_ci: []
