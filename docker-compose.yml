# Passive Workers — recommended setup: the research desk + a self-hosted SearXNG, and
# (optionally) your own network coordinator.
# SearXNG is the ecosystem's converged answer to public-search rate limiting AND keeps
# your queries off commercial search providers. `pworkers research` auto-detects it.
#
#   docker compose up -d searxng                    # just the private meta-search (pworkers runs on the host)
#   docker compose up -d searxng research-desk       # search + research desk together
#   PW_TOKEN=$(openssl rand -hex 24) docker compose up -d coordinator   # self-host a network hub
#
# Note: the research desk needs to reach your Ollama; on Docker Desktop (Mac/Windows) AND on Linux
# Docker Engine (20.10+) `host.docker.internal` now resolves via the `extra_hosts` entry below.
# Running `pworkers` directly on the host with only SearXNG in Docker is still the simplest setup.
#
# Note (Linux only): the image runs as the unprivileged user `pw` (UID/GID 1000), never root. On
# Docker Desktop that's moot (its VirtioFS/gRPC-FUSE layer remaps bind-mount ownership to your host
# user), but on plain Linux Docker Engine a bind mount does NOT remap UIDs, so the container's UID is
# what owns (and, for 0600 credential files, alone can read) the files it writes into your shared
# ~/.passiveworkers. PW_UID/PW_GID below default to 1000 (the common first-user UID on single-user
# Linux boxes) — override them with `id -u`/`id -g` if yours differ, so your host-native `pworkers`
# CLI can still read them, e.g.: PW_UID=$(id -u) PW_GID=$(id -g) docker compose up -d research-desk
#
# Images are pinned by digest (tag kept for readability). Refresh a pin with
#   docker buildx imagetools inspect <image>:<tag>   → the top-level "Digest:" line

services:
  searxng:
    image: searxng/searxng:latest@sha256:85492ba800a861e3e8ff6014c430e81369fe6ca766a9990595f616d1ce95b272
    container_name: pw-searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    restart: unless-stopped

  research-desk:
    build: .
    container_name: pw-desk
    command: pworkers serve
    user: "${PW_UID:-1000}:${PW_GID:-1000}"
    ports:
      - "127.0.0.1:8770:8770"
    environment:
      - PW_OLLAMA_BASE=http://host.docker.internal:11434
      - PW_SEARXNG_URL=http://searxng:8080
      - PW_WEB_BACKEND=searxng
      - PW_HOME=/app/data   # reports/library/config live here — bind-mounted below (fixes a
                            # stale ./reports mount from before paths.py moved reports under
                            # ~/.passiveworkers)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resolves on Linux Docker Engine too; a
                                               # harmless no-op on Docker Desktop, where it
                                               # already resolves
    volumes:
      - ${HOME}/.passiveworkers:/app/data     # the SAME home the host's own `pworkers` CLI uses
                                               # (passiveworkers/paths.py) — survives `compose down`
    depends_on:
      - searxng
    restart: unless-stopped

  # Self-hostable network hub (passiveworkers/net/coordinator_app.py). Lets `pworkers join <url> <token>`
  # (run on any other machine) register against a coordinator you run yourself. `pworkers host` — a
  # one-command wrapper around this — doesn't exist yet, so this runs the module directly,
  # exactly like scripts/vps_run.sh already does on a bare VPS. Swap the `command:` below for
  # `pworkers host` once that verb ships.
  coordinator:
    build: .
    container_name: pw-coordinator
    command: python -m passiveworkers.net.coordinator_app
    ports:
      # loopback-only by default: front it with a tunnel/reverse proxy + TLS before pointing a
      # remote worker's `pworkers join` at it. Override PW_PORT to change the port.
      - "127.0.0.1:${PW_PORT:-8088}:${PW_PORT:-8088}"
    environment:
      # required, no default — the coordinator's own startup guard refuses to bind non-loopback
      # (PW_HOST=0.0.0.0, needed below) with a weak/default token anyway.
      - PW_TOKEN=${PW_TOKEN:?set PW_TOKEN before starting the coordinator, e.g. export PW_TOKEN=$(openssl rand -hex 24)}
      - PW_ENROLL=${PW_ENROLL:-1}   # require a minted enrollment token to register (see
                                    # docs/network/SELF_HOST.md) — set 0 for a fully open coordinator
      - PW_HOST=0.0.0.0   # binds inside the container's OWN network namespace; the `ports:`
                          # mapping above is what actually controls host-level exposure
      - PW_PORT=${PW_PORT:-8088}
      - PW_DB=/app/data/coordinator.db
    volumes:
      # a fresh volume inherits the image's pw-owned /app/data. A volume created by an older,
      # root-running image stays root-owned — hand it over once before upgrading:
      #   docker compose run --rm --user root --entrypoint chown coordinator -R pw:pw /app/data
      - pw-coordinator-db:/app/data
    restart: unless-stopped

volumes:
  pw-coordinator-db:
