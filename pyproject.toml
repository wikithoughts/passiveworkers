[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "passiveworkers"
version = "0.5.0"
description = "The research engine you own: many local models research the live web as independent analysts, and a blind editor writes one cited report that keeps their disagreements. Opt-in: a commons where idle computers do research for each other, no token and no cloud in the middle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Passive Workers" }]
maintainers = [{ name = "Passive Workers" }]
keywords = ["deep-research", "ollama", "local-first", "llm", "rag", "privacy", "mcp", "distributed", "federation", "compute-network", "marketplace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "requests>=2.32",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=7.0",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Better main-content + date extraction for page evidence (Apache-2.0). Graceful
# fallback to a regex strip when absent — install for noticeably cleaner reports.
extract = ["trafilatura>=2.0"]
# Private-document library (local RAG): index your own PDFs/Word/text files.
docs = ["pypdf>=4.0", "python-docx>=1.1"]
# Run as an MCP server so Claude Desktop / Codex can call the engine as a tool.
mcp = ["mcp>=1.0"]
# Signed + encrypted marketplace deliverables (Ed25519 + X25519 SealedBox).
crypto = ["pynacl>=1.5"]
# Offline IP→country verification on node registration (no egress; needs an operator-supplied
# GeoLite2 .mmdb via PW_GEOIP_DB). Without it, the coordinator falls back to self-reported country.
geoip = ["geoip2>=4.0"]
# Everything.
all = ["trafilatura>=2.0", "pypdf>=4.0", "python-docx>=1.1", "mcp>=1.0", "pynacl>=1.5", "geoip2>=4.0"]
# Contributor tooling: the test runner + coverage plugin + the lint gate CI runs (see
# CONTRIBUTING.md's quick start — this is the ONE place both are declared, so a contributor's
# local `ruff check .` can't silently drift from CI's). Also needs Node 18+ on PATH for the
# front-end guard/harness (scripts/check_app_js.sh, scripts/fe_test.js) — not pip-installable.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wikithoughts/passiveworkers"
Repository = "https://github.com/wikithoughts/passiveworkers"
Issues = "https://github.com/wikithoughts/passiveworkers/issues"
Documentation = "https://github.com/wikithoughts/passiveworkers#readme"
Changelog = "https://github.com/wikithoughts/passiveworkers/blob/main/CHANGELOG.md"
Evidence = "https://wikithoughts.github.io/passiveworkers/"
Security = "https://github.com/wikithoughts/passiveworkers/security/advisories/new"

[project.scripts]
pw = "council.cli:main"

[tool.setuptools.packages.find]
include = ["council*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# The CI gate is the high-signal subset: pyflakes (F — undefined names, unused imports/vars) plus
# syntax errors (E9). Style-only rules are intentionally not enforced yet (the codebase favours long
# explanatory comments). Widen this set over time.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Unused locals in tests are frequently intentional (binding a result for readability / a side effect).
"tests/**" = ["F841"]
"scripts/**" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient (which fastapi.testclient re-exports) emits this on every import;
    # it's an upstream heads-up about httpx, not something under this repo's control yet.
    # Scoped to exactly this warning class — nothing else is silenced.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.pyright]
# Scoped, ADVISORY type-checking (R36/D52). Starts on the federation layer only — the highest-value,
# most-tested surface, where the pydantic request/response models already carry real types. `basic` mode
# is Any-tolerant, so the dynamic `sqlite3.Row["col"]` / `json.loads(...)` patterns don't explode. The CI
# `types` job runs this but does NOT gate the build (continue-on-error) — signal now, enforcement later.
# Widen `include` module-by-module as the surface is annotated; NOT strict, NOT repo-wide by design.
include = ["council/net"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = "none"          # optional extras (geoip2, pynacl, …) are lazy-imported
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportAttributeAccessIssue = "warning"
