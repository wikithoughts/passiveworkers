[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "passiveworkers"
version = "0.1.3"
description = "Make your computer work for you and others: a local-first compute network where machines do typed jobs for each other. Flagship task — deep research: local LLMs research the live web as independent analysts and a blind editor compiles one cited report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Passive Workers" }]
maintainers = [{ name = "Passive Workers" }]
keywords = ["deep-research", "ollama", "local-first", "llm", "rag", "privacy", "mcp", "distributed", "federation", "compute-network", "marketplace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "requests>=2.32",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=7.0",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Better main-content + date extraction for page evidence (Apache-2.0). Graceful
# fallback to a regex strip when absent — install for noticeably cleaner reports.
extract = ["trafilatura>=2.0"]
# Private-document library (local RAG): index your own PDFs/Word/text files.
docs = ["pypdf>=4.0", "python-docx>=1.1"]
# Run as an MCP server so Claude Desktop / Codex can call the engine as a tool.
mcp = ["mcp>=1.0"]
# Signed + encrypted marketplace deliverables (Ed25519 + X25519 SealedBox).
crypto = ["pynacl>=1.5"]
# Offline IP→country verification on node registration (no egress; needs an operator-supplied
# GeoLite2 .mmdb via PW_GEOIP_DB). Without it, the coordinator falls back to self-reported country.
geoip = ["geoip2>=4.0"]
# Everything.
all = ["trafilatura>=2.0", "pypdf>=4.0", "python-docx>=1.1", "mcp>=1.0", "pynacl>=1.5", "geoip2>=4.0"]

[project.urls]
Homepage = "https://github.com/wikithoughts/passiveworkers"
Repository = "https://github.com/wikithoughts/passiveworkers"
Issues = "https://github.com/wikithoughts/passiveworkers/issues"
Documentation = "https://github.com/wikithoughts/passiveworkers#readme"
Changelog = "https://github.com/wikithoughts/passiveworkers/blob/main/CHANGELOG.md"

[project.scripts]
pw = "council.cli:main"

[tool.setuptools.packages.find]
include = ["council*"]
